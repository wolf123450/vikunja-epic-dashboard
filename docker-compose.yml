# Runs the dashboard. Works anywhere VIKUNJA_API_URL is reachable (e.g. a LAN address).
# If Vikunja runs in Docker on the same host, also apply docker-compose.network.yml to join
# its network and use http://vikunja:3456 as VIKUNJA_API_URL:
#   docker compose -f docker-compose.yml -f docker-compose.network.yml up -d --build
services:
  dashboard:
    build: .
    image: vikunja-epic-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - dashboard-data:/data

volumes:
  dashboard-data:
